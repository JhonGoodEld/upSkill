<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Docente — upSkill</title>
  <link rel="stylesheet" href="../css/crm.css" />
</head>
<body>

  <div id="appView" class="oculto">
    <header class="crm-topbar">
      <h1>CRM · Docente</h1>
      <div class="user">
        <span id="userNombre"></span>
        <span class="rol">docente</span>
        <button id="btnLogout">Salir</button>
      </div>
    </header>

    <nav class="crm-tabs">
      <button data-tab="contactos" class="activo">Mis contactos</button>
      <button data-tab="metricas">Métricas</button>
    </nav>

    <main class="crm-main">

      <!-- -------- CONTACTOS -------- -->
      <section id="tab-contactos" class="crm-view activo">
        <div class="crm-toolbar">
          <input type="search" id="fBuscar" placeholder="Buscar por nombre, correo o curso..." />
          <select id="fEstado">
            <option value="">Todos los estados</option>
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
          </select>
          <select id="fEtapa">
            <option value="">Todas las etapas</option>
            <option value="Prospecto">Prospecto</option>
            <option value="Inscrito">Inscrito</option>
            <option value="Al dia">Al día</option>
            <option value="En riesgo">En riesgo</option>
            <option value="Graduado">Graduado</option>
          </select>
          <button class="btn" id="btnNuevo">+ Nuevo contacto</button>
        </div>

        <div class="crm-tabla-wrap">
          <table class="crm">
            <thead>
              <tr>
                <th>ID</th><th>Nombre</th><th>Correo</th><th>Teléfono</th>
                <th>Curso</th><th>Estado</th><th>Etapa</th><th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbodyContactos"></tbody>
          </table>
          <div id="contactosVacio" class="vacio oculto">Sin contactos que coincidan.</div>
        </div>
      </section>

      <!-- -------- MÉTRICAS -------- -->
      <section id="tab-metricas" class="crm-view">
        <div class="crm-cards" id="cardsMetricas"></div>
        <div class="crm-grid-2">
          <div class="crm-panel">
            <h3>Contactos por etapa</h3>
            <canvas id="chartEtapas" height="220"></canvas>
          </div>
          <div class="crm-panel">
            <h3>Sin seguimiento <small id="riesgoDias"></small></h3>
            <div class="crm-tabla-wrap">
              <table class="crm">
                <thead><tr><th>Contacto</th><th>Etapa</th><th>Último seguimiento</th></tr></thead>
                <tbody id="tbodyRiesgo"></tbody>
              </table>
              <div id="riesgoVacio" class="vacio oculto">Todos con seguimiento reciente. 🎉</div>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- ===================== MODAL CONTACTO ===================== -->
  <div id="modalContacto" class="crm-modal oculto">
    <div class="box">
      <h2 id="modalContactoTitulo">Nuevo contacto</h2>
      <form id="formContacto">
        <input type="hidden" id="cId" />
        <label>Nombre *<input type="text" id="cNombre" required /></label>
        <label>Correo *<input type="email" id="cCorreo" required /></label>
        <label>Teléfono<input type="text" id="cTelefono" /></label>
        <label>Curso<input type="text" id="cCurso" /></label>
        <label>Estado
          <select id="cEstado">
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
          </select>
        </label>
        <label>Etapa
          <select id="cEtapa">
            <option value="Prospecto">Prospecto</option>
            <option value="Inscrito">Inscrito</option>
            <option value="Al dia">Al día</option>
            <option value="En riesgo">En riesgo</option>
            <option value="Graduado">Graduado</option>
          </select>
        </label>
        <div class="fila">
          <button type="button" class="btn secundario" data-cerrar>Cancelar</button>
          <button type="submit" class="btn">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================== MODAL SEGUIMIENTO ===================== -->
  <div id="modalSeguimiento" class="crm-modal ancho oculto">
    <div class="box">
      <h2 id="segTitulo">Seguimiento del contacto</h2>

      <form id="formSeguimiento">
        <input type="hidden" id="sContactoId" />
        <label>Tipo
          <select id="sTipo">
            <option value="mensaje">Mensaje</option>
            <option value="tutoria">Tutoría</option>
            <option value="llamada">Llamada</option>
            <option value="correo">Correo</option>
            <option value="reunion">Reunión</option>
          </select>
        </label>
        <label>Descripción *<textarea id="sDescripcion" rows="2" required></textarea></label>
        <div class="fila">
          <button type="submit" class="btn">Registrar seguimiento</button>
        </div>
      </form>

      <hr style="border:0;border-top:1px solid var(--borde);margin:16px 0" />

      <ul class="timeline" id="timeline"></ul>
      <div id="segVacio" class="vacio oculto">Sin seguimientos registrados.</div>

      <div class="fila">
        <button type="button" class="btn secundario" data-cerrar>Cerrar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="crm-toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/crm-docente.js"></script>
</body>
</html>
