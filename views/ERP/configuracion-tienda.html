<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configuración de tienda | ERP</title><link rel="stylesheet" href="../../css/erp.css"><link rel="stylesheet" href="../../css/tienda.css"><link rel="stylesheet" href="../../css/modulos.css"></head><body class="erp-body" data-required-role="admin" data-api-base="../../api" data-login-url="../CMR/Administradores/loggin.html"><main class="store-page"><a href="erp.html">← Volver al ERP</a><h1>Configuración comercial</h1><div id="storeAdminNotice" class="store-notice"></div><section class="store-panel"><h2>Impuestos y alertas</h2><form id="storeConfigForm"><div class="store-grid-2"><div class="store-field"><label>IVA (%)</label><input id="storeIVA" type="number" min="0" max="30" step="0.01" required><small>Valor inicial: 16 %. El cambio se aplica a nuevas compras.</small></div><div class="store-field"><label>Umbral de alerta del monedero (MXN)</label><input id="storeWalletAlert" type="number" min="0" step="0.01" required></div></div><button class="store-btn" type="submit">Guardar configuración</button></form></section><section class="store-panel"><h2>Crear promoción</h2><form id="promoForm"><div class="store-grid-2"><div class="store-field"><label>Código</label><input id="promoCode" required maxlength="40" placeholder="UPSKILL10"></div><div class="store-field"><label>Nombre</label><input id="promoName" required maxlength="120"></div><div class="store-field"><label>Tipo</label><select id="promoType"><option value="porcentaje">Porcentaje</option><option value="monto">Monto fijo MXN</option></select></div><div class="store-field"><label>Valor</label><input id="promoValue" type="number" min="0.01" step="0.01" required></div><div class="store-field"><label>Inicio</label><input id="promoStart" type="datetime-local" required></div><div class="store-field"><label>Fin</label><input id="promoEnd" type="datetime-local" required></div><div class="store-field"><label>Usos máximos (opcional)</label><input id="promoMax" type="number" min="1"></div><div class="store-field"><label>Estado</label><select id="promoStatus"><option value="activo">Activo</option><option value="inactivo">Inactivo</option></select></div></div><div class="store-field"><label>Descripción</label><textarea id="promoDescription" rows="2"></textarea></div><button class="store-btn" type="submit">Guardar promoción</button></form></section><section class="store-panel"><h2>Promociones registradas</h2><div id="promoList"></div></section></main><script src="../../js/tienda-api.js"></script><script src="../../js/tienda-admin.js"></script><script src="../../js/role-guard.js"></script></body></html>
